<div class="container mt-5" style="max-width: 400px;">
  <h2 class="mb-3">Create Account</h2>

  @if (errorMessage) {
    <div class="alert alert-danger">{{ errorMessage }}</div>
  }

  <form #registerForm="ngForm" (ngSubmit)="submit(registerForm)">
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" class="form-control" name="username" ngModel required>
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" name="email" ngModel required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" name="password" ngModel required>
    </div>
    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" name="termsAndConditions" ngModel required>
      <label class="form-check-label">I agree to the Terms & Conditions</label>
    </div>
    <button class="btn btn-primary w-100" type="submit">Register</button>
  </form>

  <p class="mt-3 text-center">
    Already have an account? <a routerLink="/login">Login</a>
  </p>
</div>
