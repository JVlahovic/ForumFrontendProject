<div class="container mt-5" style="max-width: 400px;">
  <h2 class="mb-3">Forgot Password</h2>

  @if (successMessage) {
    <div class="alert alert-success">{{ successMessage }}</div>
  }
  @if (errorMessage) {
    <div class="alert alert-danger">{{ errorMessage }}</div>
  }

  @if (step === 1) {
    <form #emailForm="ngForm" (ngSubmit)="requestCode(emailForm)">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" name="email" ngModel required>
      </div>
      <button class="btn btn-primary w-100" type="submit" [disabled]="emailForm.invalid">
        Send reset code
      </button>
    </form>
  }

  @if (step === 2) {
    <form #codeForm="ngForm" (ngSubmit)="confirmCode(codeForm)">
      <div class="mb-3">
        <label class="form-label">Verification Code</label>
        <input type="text" class="form-control" name="verificationCode" ngModel required maxlength="4"
               placeholder="4-digit code">
      </div>
      <button class="btn btn-primary w-100" type="submit" [disabled]="codeForm.invalid">
        Confirm reset
      </button>
    </form>
    <p class="mt-3 text-center">
      Didn't get it?
      <a (click)="resendCode()" style="cursor: pointer; color: #0d6efd; text-decoration: underline;">Resend code</a>
    </p>
  }

  @if (step === 3) {
    <p class="text-center">You can now <a routerLink="/login">log in</a> with your new password.</p>
  }

  @if (step !== 3) {
    <p class="mt-3 text-center">
      Remembered it? <a routerLink="/login">Login</a>
    </p>
  }
</div>
