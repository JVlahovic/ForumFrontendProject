<div class="card mb-4">
  <div class="card-body">
    <h4 class="card-title mb-3">Change Password</h4>

    @if (successMessage) {
      <div class="alert alert-success">{{ successMessage }}</div>
    }
    @if (errorMessage) {
      <div class="alert alert-danger">{{ errorMessage }}</div>
    }

    <form #pwForm="ngForm" (ngSubmit)="submit(pwForm)">
      <div class="mb-3">
        <label class="form-label">Current password</label>
        <input type="password" class="form-control" name="oldPassword" ngModel required>
      </div>
      <div class="mb-3">
        <label class="form-label">New password</label>
        <input type="password" class="form-control" name="newPassword" ngModel required minlength="6">
      </div>
      <div class="mb-3">
        <label class="form-label">Repeat new password</label>
        <input type="password" class="form-control" name="confirmPassword" ngModel required minlength="6">
      </div>
      <button class="btn btn-primary" type="submit" [disabled]="pwForm.invalid">Change password</button>
    </form>
  </div>
</div>
