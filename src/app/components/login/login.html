<div class="container mt-5" style="max-width: 400px;">
  <h2 class="mb-3">Login</h2>

  @if(errorMessage)
  {
  <div  class="alert alert-danger">
    {{ errorMessage }}
  </div>
  }

  <form #loginForm="ngForm" (ngSubmit)="submit(loginForm)">
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" class="form-control" name="username" ngModel required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" name="password" ngModel required>
    </div>
    <button class="btn btn-primary w-100" type="submit">Sign in</button>
  </form>

  <p class="mt-3 text-center">
    No account? <a routerLink="/register">Register</a>
  </p>
</div>
