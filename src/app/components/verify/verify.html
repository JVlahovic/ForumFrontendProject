<div class="container mt-5" style="max-width: 400px;">
  <h2 class="mb-3">Verify Email</h2>

  @if (successMessage) {
    <div class="alert alert-success">{{ successMessage }}</div>
  }

  @if (errorMessage) {
    <div class="alert alert-danger">{{ errorMessage }}</div>
  }

  <form #verifyForm="ngForm" (ngSubmit)="submit(verifyForm)">
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" name="email" [ngModel]="email" readonly required>
    </div>
    <div class="mb-3">
      <label class="form-label">Verification Code</label>
      <input type="text" class="form-control" name="verificationCode" ngModel required maxlength="4"
             placeholder="4-digit code">
    </div>
    <button class="btn btn-primary w-100" type="submit">Verify</button>
  </form>

  <p class="mt-3 text-center">
    Didn't get a code?
    <a (click)="resend()" style="cursor: pointer; color: #0d6efd; text-decoration: underline;">Resend</a>
  </p>
</div>
