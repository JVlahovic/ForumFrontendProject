<nav class="navbar navbar-expand navbar-dark bg-dark px-3">
  <div class="container-fluid">
    <div class="navbar-nav">
      <a class="nav-link" routerLink="/">Home</a>
      <a class="nav-link" routerLink="/rules">Rules</a>
      <a class="nav-link" routerLink="/announcements">Announcements</a>
      @if (isLogged) {
        <a class="nav-link" routerLink="/user-panel">User Panel</a>
      }
      @if (isAdmin) {
        <a class="nav-link" routerLink="/admin-panel">Admin Panel</a>
      }
    </div>

    <div class="navbar-nav ms-auto align-items-center">
      @if (isLogged) {
        <form class="d-flex me-3" (submit)="onSearch($event, searchInput.value)">
          <input #searchInput class="form-control form-control-sm me-1" type="search"
                 placeholder="Search threads…" style="min-width: 180px;">
          <button class="btn btn-sm btn-outline-light" type="submit">Search</button>
        </form>
        <span class="nav-link text-light">{{ username }}</span>
        <a class="nav-link" (click)="logout()" style="cursor: pointer;">Logout</a>
      } @else {
        <a class="nav-link" routerLink="/login">Login</a>
        <a class="nav-link" routerLink="/register">Register</a>
      }
    </div>
  </div>
</nav>
